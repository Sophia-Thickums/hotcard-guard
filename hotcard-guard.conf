# Sophia's MI25 guard thresholds. Change a number, then:
#   sudo systemctl restart sophia-mi25-guard
#
# WARN_C   = log + notify only; kills NOTHING.
# TRIP_C   = park the load (SIGSTOP the card's clients), then escalate if it stays hot.
#            Below the hardware crit (105C) with margin: the runaway climb peaks ~18C/5s,
#            so one 2 s sample can overshoot; 90 leaves ~15C of headroom.
# RESUME_C = re-allow parked work once the card has cooled to here.
# INTERVAL = sample period, seconds.
# KILL_AFTER = seconds a parked load is given to cool the card before escalate.
# COOLDOWN = minimum seconds between WARN notifications (anti-spam).
# MIN_RESIDENT_MIB = vram+gtt a process must be holding ON THE MI25 to count as a
#            compute client. 256 MiB separates a real inference client from the ~28 KiB
#            probe handle that the desktop compositor opens on every DRM node. Do not
#            lower this without re-reading the guard's header — at 0 it kills the display.
WARN_C = 82.0
TRIP_C = 90.0
RESUME_C = 65.0
INTERVAL = 2.0
KILL_AFTER = 20.0
COOLDOWN = 300.0
MIN_RESIDENT_MIB = 256
