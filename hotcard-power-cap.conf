# MI25 power cap (Watts). Set by Ryan 2026-10-05: 180 W.
# WHY: the card's failure mode is thermal; watts/second are heat/second. At the default
# 260 W it latched at 105-110 C in ~10 s of sustained DMA. At 180 W the SAME run that
# killed it (llama-bench -p 2048 -ncmoe 12) completed at ~59 C peak. Change CAP_W and run
#   sudo systemctl restart mi25-power-cap.service
CAP_W = 180
